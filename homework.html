<script>

function getHelp() {

    const subject =
        document.getElementById("subject").value;

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");

    const answerText =
        document.getElementById("answerText");


    if (question === "") {

        alert(
            "Ilki bilen soragyňyzy ýazyň."
        );

        return;
    }


    answer.style.display = "block";


    answerText.innerHTML =
        "<strong>Ders:</strong> " +
        subject +
        "<br><br>" +
        "Soragyňyz kabul edildi. " +
        "AI kömekçisini birikdirenimizden soň " +
        "bu ýerde soragyňyza ädimme-ädim düşündiriş we jogap görkeziler.";

}

</script>
